<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>big-O-guard — Python Complexity Analyzer</title>
  <style>
    /* ── Reset & Base ─────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    a { color: #58a6ff; }

    /* ── Layout ───────────────────────────────── */
    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #e6edf3;
      letter-spacing: -0.5px;
    }

    header h1 span { color: #39d353; }

    header p {
      margin-top: 0.5rem;
      color: #8b949e;
      font-size: 0.95rem;
    }

    /* ── Card ─────────────────────────────────── */
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #e6edf3;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* ── Editor area ──────────────────────────── */
    .editor-wrap {
      position: relative;
    }

    .lang-badge {
      position: absolute;
      top: 0.6rem;
      right: 0.6rem;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 0.2rem 0.6rem;
      font-size: 0.75rem;
      color: #8b949e;
      font-family: monospace;
      pointer-events: none;
    }

    textarea#code {
      width: 100%;
      min-height: 260px;
      background: #0d1117;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1rem 1rem 1rem 3.2rem;
      font-family: 'Cascadia Code', 'Fira Code', 'Courier New', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
      tab-size: 4;
    }

    textarea#code:focus { border-color: #39d353; }

    .line-numbers {
      position: absolute;
      top: 1rem;
      left: 0;
      width: 2.8rem;
      text-align: right;
      padding-right: 0.5rem;
      font-family: monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #484f58;
      pointer-events: none;
      user-select: none;
    }

    .line-numbers span { display: block; }

    /* ── Controls ─────────────────────────────── */
    .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    button#analyze-btn {
      background: #238636;
      color: #fff;
      border: 1px solid #2ea043;
      border-radius: 6px;
      padding: 0.55rem 1.4rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    button#analyze-btn:hover:not(:disabled) { background: #2ea043; }
    button#analyze-btn:active:not(:disabled) { transform: scale(0.97); }
    button#analyze-btn:disabled {
      background: #21262d;
      border-color: #30363d;
      color: #484f58;
      cursor: not-allowed;
    }

    button#clear-btn {
      background: transparent;
      color: #8b949e;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 0.55rem 1rem;
      font-size: 0.9rem;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    button#clear-btn:hover { color: #e6edf3; border-color: #8b949e; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #ffffff44;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Results ──────────────────────────────── */
    #results { display: none; }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1.2rem;
    }

    .metric-box {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }

    .metric-box .label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8b949e;
      margin-bottom: 0.4rem;
    }

    .metric-box .value {
      font-size: 1.4rem;
      font-weight: 700;
      font-family: monospace;
      color: #e6edf3;
    }

    .metric-box .sub {
      font-size: 0.72rem;
      color: #484f58;
      margin-top: 0.2rem;
    }

    /* Complexity colour coding */
    .c-o1    { color: #39d353; }  /* O(1)    — green */
    .c-logn  { color: #39d353; }  /* O(log n) */
    .c-on    { color: #58a6ff; }  /* O(n)    — blue */
    .c-onlogn{ color: #d29922; }  /* O(n log n) — yellow */
    .c-on2   { color: #f78166; }  /* O(n^2)  — orange */
    .c-exp   { color: #ff7b72; }  /* O(2^n) / O(n!) — red */

    .explanation-box {
      background: #0d1117;
      border-left: 3px solid #39d353;
      border-radius: 0 6px 6px 0;
      padding: 0.9rem 1rem;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #c9d1d9;
    }

    .details-row {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: 0.8rem;
    }

    .badge {
      font-size: 0.75rem;
      font-family: monospace;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      border: 1px solid;
    }

    .badge-green { color: #39d353; border-color: #39d353; background: #0d2918; }
    .badge-orange { color: #f78166; border-color: #f78166; background: #2a1410; }
    .badge-blue  { color: #58a6ff; border-color: #58a6ff; background: #0d1e38; }
    .badge-gray  { color: #8b949e; border-color: #30363d; background: #0d1117; }

    /* ── Error ────────────────────────────────── */
    #error-box {
      display: none;
      background: #2a1410;
      border: 1px solid #f78166;
      border-radius: 8px;
      padding: 1rem;
      color: #f78166;
      font-size: 0.9rem;
      font-family: monospace;
    }

    /* ── Samples ──────────────────────────────── */
    .samples {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 0.4rem;
    }

    .samples span {
      font-size: 0.8rem;
      color: #8b949e;
    }

    .sample-btn {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 0.2rem 0.7rem;
      font-size: 0.8rem;
      color: #8b949e;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .sample-btn:hover { color: #e6edf3; border-color: #8b949e; }

    /* ── Footer ───────────────────────────────── */
    footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #484f58;
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>big-O<span>guard</span></h1>
    <p>Python static + runtime complexity analyzer &mdash; hackathon edition</p>
  </header>

  <!-- Input card -->
  <div class="card">
    <h2>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="#39d353"><path d="M0 1.75A.75.75 0 0 1 .75 1h14.5a.75.75 0 0 1 0 1.5H.75A.75.75 0 0 1 0 1.75zm0 4a.75.75 0 0 1 .75-.75H8a.75.75 0 0 1 0 1.5H.75A.75.75 0 0 1 0 5.75zm0 4a.75.75 0 0 1 .75-.75h10.5a.75.75 0 0 1 0 1.5H.75A.75.75 0 0 1 0 9.75zm0 4a.75.75 0 0 1 .75-.75h6a.75.75 0 0 1 0 1.5h-6a.75.75 0 0 1-.75-.75z"/></svg>
      Python Code Input
    </h2>

    <div class="editor-wrap">
      <div class="line-numbers" id="line-numbers">
        <span>1</span>
      </div>
      <textarea id="code" spellcheck="false" placeholder="# Paste your Python code here...

def bubble_sort(arr):
    n = len(arr)
    for i in range(n):
        for j in range(0, n - i - 1):
            if arr[j] > arr[j + 1]:
                arr[j], arr[j + 1] = arr[j + 1], arr[j]
    return arr"></textarea>
      <span class="lang-badge">Python 3</span>
    </div>

    <div class="controls">
      <button id="analyze-btn" onclick="analyze()">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0zM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0zm4.879-2.773 4.264 2.559a.25.25 0 0 1 0 .428l-4.264 2.559A.25.25 0 0 1 6 10.559V5.441a.25.25 0 0 1 .379-.214z"/></svg>
        Run Analysis
      </button>
      <button id="clear-btn" onclick="clearAll()">Clear</button>
    </div>

    <div class="samples" style="margin-top: 0.8rem;">
      <span>Quick examples:</span>
      <button class="sample-btn" onclick="loadSample('o1')">O(1)</button>
      <button class="sample-btn" onclick="loadSample('on')">O(n)</button>
      <button class="sample-btn" onclick="loadSample('on2')">O(n²)</button>
      <button class="sample-btn" onclick="loadSample('rec')">O(2^n)</button>
    </div>
  </div>

  <!-- Error box -->
  <div id="error-box"></div>

  <!-- Results card -->
  <div class="card" id="results">
    <h2>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="#39d353"><path d="M0 0h16v16H0zm1.5 2v11L8 9.4l6.5 3.6V2zm1 1h11v8.4L8 8 2.5 11.4z"/></svg>
      Analysis Results
    </h2>

    <div class="metrics-grid">
      <div class="metric-box">
        <div class="label">Time Complexity</div>
        <div class="value" id="r-time">—</div>
        <div class="sub" id="r-time-note"></div>
      </div>
      <div class="metric-box">
        <div class="label">Space Complexity</div>
        <div class="value" id="r-space">—</div>
      </div>
      <div class="metric-box">
        <div class="label">Execution Time</div>
        <div class="value" id="r-exec">—</div>
        <div class="sub">milliseconds</div>
      </div>
      <div class="metric-box">
        <div class="label">Peak Memory</div>
        <div class="value" id="r-mem">—</div>
        <div class="sub">kilobytes</div>
      </div>
    </div>

    <div class="explanation-box" id="r-explanation"></div>
    <div class="details-row" id="r-details"></div>
    <div id="r-space-note" style="margin-top:0.6rem; font-size:0.82rem; color:#8b949e;"></div>
  </div>

</div>

<footer>big-O-guard &mdash; Python Complexity Analyzer &mdash; Hackathon 2025</footer>

<script>
  // ── Sample snippets ────────────────────────────────────────────────────────
  const SAMPLES = {
    o1: `# O(1) — Constant time\nx = 42\ny = x * 2 + 1\nprint(y)`,
    on: `# O(n) — Linear time\ndef find_max(arr):\n    maximum = arr[0]\n    for item in arr:\n        if item > maximum:\n            maximum = item\n    return maximum`,
    on2: `# O(n^2) — Quadratic time\ndef bubble_sort(arr):\n    n = len(arr)\n    for i in range(n):\n        for j in range(0, n - i - 1):\n            if arr[j] > arr[j + 1]:\n                arr[j], arr[j + 1] = arr[j + 1], arr[j]\n    return arr`,
    rec: `# O(2^n) — Exponential time (naive recursion)\ndef fib(n):\n    if n <= 1:\n        return n\n    return fib(n - 1) + fib(n - 2)\n\nfib(10)`,
  };

  function loadSample(key) {
    document.getElementById('code').value = SAMPLES[key];
    updateLineNumbers();
    hideResults();
  }

  // ── Line numbers ───────────────────────────────────────────────────────────
  function updateLineNumbers() {
    const ta = document.getElementById('code');
    const ln = document.getElementById('line-numbers');
    const lines = ta.value.split('\n').length;
    ln.innerHTML = Array.from({ length: lines }, (_, i) =>
      `<span>${i + 1}</span>`
    ).join('');
  }

  document.getElementById('code').addEventListener('input', updateLineNumbers);
  document.getElementById('code').addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = this.selectionStart, end = this.selectionEnd;
      this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
      this.selectionStart = this.selectionEnd = start + 4;
      updateLineNumbers();
    }
  });

  updateLineNumbers();

  // ── Complexity colour class ────────────────────────────────────────────────
  function complexityClass(c) {
    if (c === 'O(1)')      return 'c-o1';
    if (c === 'O(log n)')  return 'c-logn';
    if (c === 'O(n)')      return 'c-on';
    if (c === 'O(n log n)')return 'c-onlogn';
    if (c === 'O(n^2)')    return 'c-on2';
    return 'c-exp';
  }

  // ── UI helpers ─────────────────────────────────────────────────────────────
  function hideResults() {
    document.getElementById('results').style.display = 'none';
    document.getElementById('error-box').style.display = 'none';
  }

  function clearAll() {
    document.getElementById('code').value = '';
    updateLineNumbers();
    hideResults();
  }

  function setLoading(on) {
    const btn = document.getElementById('analyze-btn');
    btn.disabled = on;
    btn.innerHTML = on
      ? '<span class="spinner"></span> Analyzing…'
      : `<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0zM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0zm4.879-2.773 4.264 2.559a.25.25 0 0 1 0 .428l-4.264 2.559A.25.25 0 0 1 6 10.559V5.441a.25.25 0 0 1 .379-.214z"/></svg> Run Analysis`;
  }

  // ── Main analysis call ─────────────────────────────────────────────────────
  async function analyze() {
    const code = document.getElementById('code').value.trim();
    if (!code) {
      showError('Please enter some Python code before analyzing.');
      return;
    }

    hideResults();
    setLoading(true);

    try {
      const res = await fetch('/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code }),
      });

      const data = await res.json();

      if (!res.ok || data.error) {
        showError(data.error || 'Unknown error from server.');
        return;
      }

      renderResults(data);
    } catch (e) {
      showError('Could not reach the server. Is Flask running?');
    } finally {
      setLoading(false);
    }
  }

  function showError(msg) {
    const box = document.getElementById('error-box');
    box.textContent = '⚠ ' + msg;
    box.style.display = 'block';
    document.getElementById('results').style.display = 'none';
  }

  function renderResults(d) {
    const tc = d.time_complexity;
    const sc = d.space_complexity;

    const tEl = document.getElementById('r-time');
    tEl.textContent = tc;
    tEl.className = 'value ' + complexityClass(tc);

    const sEl = document.getElementById('r-space');
    sEl.textContent = sc;
    sEl.className = 'value ' + complexityClass(sc);

    document.getElementById('r-exec').textContent = d.execution_time_ms;
    document.getElementById('r-mem').textContent = d.peak_memory_kb;
    document.getElementById('r-explanation').textContent = d.explanation;
    document.getElementById('r-space-note').textContent = d.space_note || '';

    const det = document.getElementById('r-details');
    const badges = [];
    if (d.details.has_recursion)
      badges.push(`<span class="badge badge-orange">recursion detected</span>`);
    if (d.details.loop_depth >= 2)
      badges.push(`<span class="badge badge-orange">nested loops (depth ${d.details.loop_depth})</span>`);
    else if (d.details.loop_depth === 1)
      badges.push(`<span class="badge badge-blue">single loop</span>`);
    else
      badges.push(`<span class="badge badge-green">no loops</span>`);

    if (d.details.runtime_error)
      badges.push(`<span class="badge badge-orange">runtime error: ${d.details.runtime_error}</span>`);

    det.innerHTML = badges.join('');

    document.getElementById('results').style.display = 'block';
    document.getElementById('error-box').style.display = 'none';
  }
</script>
</body>
</html>
