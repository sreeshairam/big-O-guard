kind = "web"
previewPath = "/"
title = "big-O-guard"
version = "1.0.0"
id = "artifacts/big-o-guard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25882

[services.development]
run = "pnpm --filter @workspace/big-o-guard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/big-o-guard", "run", "build" ]
publicDir = "artifacts/big-o-guard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25882"
BASE_PATH = "/"
